# Web pages the Device Manager can open for a hardware ID. Nothing is sent by itself: the user
# presses a button, and only what is in the URL below leaves the computer.
# {bus} = pci or usb, {vendor} and {device} = four hex digits, {words} = the typed search words.
hardware=https://linux-hardware.org/?id={bus}:{vendor}-{device}
lkddb=https://duckduckgo.com/?q=site%3Acateee.net+%22{vendor}+{device}%22
search=https://duckduckgo.com/?q=site%3Alinux-hardware.org+{words}
