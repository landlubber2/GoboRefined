# LXDM settings for the GoboLinux spin (installed as /Programs/LXDM/Settings/lxdm/lxdm.conf,
# seen by LXDM as /etc/lxdm/lxdm.conf).
[base]
## the session is the user's ~/.xinitrc (see Xsession next to this file); awesome if there is none
session=/System/Index/bin/awesome
## automatic login: uncomment and set a login name
# autologin=
numlock=0
greeter=/Programs/LXDM/0.5.3/lib/lxdm-greeter-gtk

[server]
## start X without the stock grey weave; restart it after each logout so that no
## program of the last session (screen locker, ...) stays on the login screen
arg=/usr/bin/X -background none
reset=1

[display]
gtk_theme=Adwaita
bottom_pane=1
lang=0
keyboard=0
theme=Gobo11
## the session is always ~/.xinitrc, so there is nothing to choose
hide_sessions=1

[input]

[userlist]
## ask for the login name instead of showing a list of users
disable=1
white=
black=
