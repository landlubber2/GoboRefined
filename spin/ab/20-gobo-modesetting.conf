# GoboRefined: graphics on the X server's built-in "modesetting" driver (KMS + glamor), as current
# distributions do, instead of the old per-vendor DDX drivers of 017.01.
# 0.8.3: Intel. With autoconfiguration Xorg picked the old "intel" DDX (xf86-video-intel 2.99.917)
#   on a ThinkPad with Tiger Lake Xe graphics (8086:9a49) and the desktop showed only a thin strip.
# 0.8.4: the same rule for every KMS driver of current Intel and AMD graphics: i915 and xe (Intel),
#   amdgpu and radeon (AMD).
# 0.10.4: VirtualBox and VMware (kernel driver vmwgfx) too: Mesa 26 no longer has libxatracker, which
#   017.01's "vmware" DDX needs; modesetting + glamor runs on Mesa's svga driver instead.
# 0.10.5: NVIDIA (kernel driver nouveau) too. Mesa 26's GLX works only over DRI3; with 017.01's nouveau
#   DDX Xorg allowed DRI level 2 only, so on a GTX 1060 every OpenGL program was drawn by llvmpipe
#   (software). With modesetting: glamor on the card (NV136), glxinfo "Accelerated: yes".
Section "OutputClass"
   Identifier "Intel graphics (i915): modesetting driver"
   MatchDriver "i915"
   Driver "modesetting"
EndSection

Section "OutputClass"
   Identifier "Intel graphics (xe): modesetting driver"
   MatchDriver "xe"
   Driver "modesetting"
EndSection

Section "OutputClass"
   Identifier "AMD graphics (amdgpu): modesetting driver"
   MatchDriver "amdgpu"
   Driver "modesetting"
EndSection

Section "OutputClass"
   Identifier "AMD graphics (radeon): modesetting driver"
   MatchDriver "radeon"
   Driver "modesetting"
EndSection

Section "OutputClass"
   Identifier "VirtualBox/VMware graphics (vmwgfx): modesetting driver"
   MatchDriver "vmwgfx"
   Driver "modesetting"
EndSection

Section "OutputClass"
   Identifier "NVIDIA graphics (nouveau): modesetting driver"
   MatchDriver "nouveau"
   Driver "modesetting"
EndSection
