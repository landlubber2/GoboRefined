# GoboRefined: graphics on the X server's built-in "modesetting" driver (KMS + glamor), as current
# distributions do, instead of the old per-vendor DDX drivers of 017.01.
# 0.8.3: Intel. With autoconfiguration Xorg picked the old "intel" DDX (xf86-video-intel 2.99.917)
#   on a ThinkPad with Tiger Lake Xe graphics (8086:9a49) and the desktop showed only a thin strip.
# 0.8.4: the same rule for every KMS driver of current Intel and AMD graphics: i915 and xe (Intel),
#   amdgpu and radeon (AMD). NVIDIA (nouveau) is deliberately NOT matched: the nouveau DDX works on
#   the owner's desktop PC and modesetting on nouveau is not proven here. VirtualBox (vmwgfx) and
#   everything else keep Xorg's own choice.
Section "OutputClass"
   Identifier "Intel graphics (i915): modesetting driver"
   MatchDriver "i915"
   Driver "modesetting"
EndSection

Section "OutputClass"
   Identifier "Intel graphics (xe): modesetting driver"
   MatchDriver "xe"
   Driver "modesetting"
EndSection

Section "OutputClass"
   Identifier "AMD graphics (amdgpu): modesetting driver"
   MatchDriver "amdgpu"
   Driver "modesetting"
EndSection

Section "OutputClass"
   Identifier "AMD graphics (radeon): modesetting driver"
   MatchDriver "radeon"
   Driver "modesetting"
EndSection
