# GoboRefined 0.8.3: Intel graphics use the kernel modesetting driver, not the old "intel" DDX
# (xf86-video-intel 2.99.917). With autoconfiguration Xorg picked "intel" first on a ThinkPad with
# Tiger Lake Xe graphics (8086:9a49) and the desktop showed only a thin strip. Matches only devices
# driven by the i915 kernel driver; everything else (VirtualBox, NVIDIA, AMD) is not affected.
Section "OutputClass"
   Identifier "Intel graphics: kernel modesetting driver"
   MatchDriver "i915"
   Driver "modesetting"
EndSection
