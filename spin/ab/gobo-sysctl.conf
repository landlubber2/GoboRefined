# GoboRefined (0.9.1): kernel settings that make the system a little harder to attack and do not
# get in the way of a desktop. Loaded at every start (BootUp: sysctl -p this file).
#
# The kernel log (dmesg) only for root (the system report asks through Settings).
kernel.dmesg_restrict = 1
# Kernel addresses hidden from normal users.
kernel.kptr_restrict = 1
# Links and hard links in shared folders (/tmp) cannot be used to trick root or other users.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
# Packets that claim to come from a network they cannot come from are dropped.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# A program may only look into (debug) its own child programs, not into everything the user runs.
kernel.yama.ptrace_scope = 1
