# GoboRefined 0.8.4: touchpads. 017.01 has no libinput Xorg driver; touchpads use xf86-input-synaptics
# 1.9.1 (its 70-synaptics.conf "touchpad catchall"), where tapping is off on modern clickpads.
# Tap to click like other systems: one finger = left click, two = right click, three = middle;
# scrolling with two fingers (vertical and horizontal). Only devices on the synaptics driver.
Section "InputClass"
   Identifier "GoboRefined touchpad: tap to click, two-finger scrolling"
   MatchDriver "synaptics"
   Option "TapButton1" "1"
   Option "TapButton2" "3"
   Option "TapButton3" "2"
   Option "VertTwoFingerScroll" "on"
   Option "HorizTwoFingerScroll" "on"
EndSection
