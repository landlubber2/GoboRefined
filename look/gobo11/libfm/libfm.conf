# gobo11 look: libfm settings used by PCManFM (copied to ~/.config/libfm/ if absent)
[config]
single_click=0
use_trash=1
confirm_del=1
confirm_trash=1
terminal=urxvt
thumbnail_local=1
thumbnail_max=4096
show_internal_volumes=0
quick_exec=0

[ui]
big_icon_size=48
small_icon_size=24
pane_icon_size=24
thumbnail_size=128
show_thumbnail=1
shadow_hidden=1

[places]
places_home=1
places_desktop=1
places_root=1
places_computer=0
places_trash=0
places_applications=0
places_network=0
places_unmounted=0
