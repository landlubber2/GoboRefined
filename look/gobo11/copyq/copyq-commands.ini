1\Command="var spinOnClipboardChanged = onClipboardChanged\nonClipboardChanged = function() {\n  spinOnClipboardChanged()\n  // GoboRefined: take over the clipboard with the same text or picture, so it stays\n  // available after the program it came from has closed\n  var item = {}, n = 0, formats = dataFormats()\n  // 0.10.5: files copied in a file manager are left alone: pasting them needs the file\n  // manager's own formats (x-special/gnome-copied-files), which a text copy would drop\n  if (formats.indexOf(\"x-special/gnome-copied-files\") >= 0 || formats.indexOf(\"text/uri-list\") >= 0) return\n  for (var i = 0; i < formats.length; ++i) {\n    var f = formats[i]\n    if (f.indexOf(\"text/\") === 0 || f === \"image/png\") { item[f] = data(f); ++n }\n  }\n  if (n > 0) copy(item)\n}"
1\IsScript=true
1\Name=GoboRefined: keep the clipboard after its program closes
