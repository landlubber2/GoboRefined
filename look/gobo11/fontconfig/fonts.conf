<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- gobo11 look: Inter for sans-serif text, JetBrains Mono for monospace.
     Applies to every program that asks fontconfig for a generic family
     (Firefox, Qt and GTK programs, xterm -fa monospace, ...). -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
