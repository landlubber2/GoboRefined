# Compositor settings for the gobo11 look: soft neutral shadows and quick fades.
shadow = true;
shadow-radius = 22;
shadow-offset-x = -22;
shadow-offset-y = -14;
shadow-opacity = 0.5;
shadow-exclude = [
   "window_type = 'dock'",
   "window_type = 'desktop'",
   "window_type = 'menu'",
   "window_type = 'dropdown_menu'",
   "window_type = 'popup_menu'",
   "window_type = 'tooltip'",
   "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-delta = 4;
fade-in-step = 0.07;
fade-out-step = 0.07;
no-fading-openclose = false;

detect-rounded-corners = true;
detect-client-opacity = true;
